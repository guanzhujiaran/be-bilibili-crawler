}

// app下载白名单
message AppPackageDto {
    // 包大小(单位bytes)
    int64 size = 1;
    //
    string display_name = 2;
    //
    string apk_name = 3;
    // url
    string url = 4;
    // bili schema url
    string bili_url = 5;
    // 包md5
    string md5 = 6;
    // 包icon
    string icon = 7;
    // 开发者姓名
    string dev_name = 8;
    // 权限地址
    string auth_url = 9;
    // 权限名，逗号隔开
    string auth_name = 10;
    // 版本
    string version = 11;
    // 更新时间,yy-mm-hh格式
    string update_time = 12;
    // 隐私协议标题
    string privacy_name = 13;
    // 隐私协议url
    string privacy_url = 14;
}

