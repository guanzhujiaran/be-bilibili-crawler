// 暂停页落地页
message PauseAdLandingPage {
    // 背景色
    PauseAdBackgroundColor background_color = 1;
    // 模块列表
    repeated PauseAdLandingPageModule modules = 2;
    // 底部组件
    PauseAdBottomComponent bottom_component = 3;
    // 可点击区域
    repeated string clickable_areas = 4;
    // 可上报区域
    repeated string reportable_areas = 5;
    // 自定义展示url
    CustomShowUrlInfo custom_show_urls = 6;
    // 是否开启滑动上报
    bool enable_slide_report = 7;
}

// 品牌暂停页
message BrandPausePageDto {
    oneof card {
        // 轮播卡
        LoopCard loop_card = 1;
    }
}

// 轮播卡
message LoopCard {
    // 卡片列表
    repeated LoopCardItem items = 1;
}

// 轮播卡条目
message LoopCardItem {
    // 图片
    string img = 1;
    // 跳转链接
    string jump_url = 2;
}

// 动态暂停页
message PausedDynamicPage {
    // 相关稿件
    repeated int64 related_aids = 1;
    oneof page {
        // BX页
        BxPage bx_page = 2;
    }
}

// BX页
message BxPage {
    // 页面id
    string page_id = 1;
}

// 暂停页背景色
message PauseAdBackgroundColor {
    // 日间颜色
    string color_day = 1;
    // 夜间颜色
    string color_night = 2;
}

// 暂停页落地页模块
message PauseAdLandingPageModule {
    // 模块类型
    int32 module_type = 1;
    // 图片
    string img = 2;
    // 跳转链接
    string jump_url = 3;
}

// 暂停页底部组件
message PauseAdBottomComponent {
    // 文本
    string text = 1;
    // 跳转链接
    string jump_url = 2;
}

// 自定义展示url
message CustomShowUrlInfo {
    // 展示url列表
    repeated string show_urls = 1;
    // 点击url列表
    repeated string click_urls = 2;
}
