// 广告数据
message SourceContentDto {
    // 广告请求id
    string request_id = 1;
    // 广告资源位source ID
    int32 source_id = 2;
    // 广告资源位resource ID
    int32 resource_id = 3;
    // 广告位上报标记,对广告返回数据恒为true
    bool is_ad_loc = 4;
    // 与天马现有逻辑一致, 0有含义
    // 0:内容 1:广告
    google.protobuf.Int32Value server_type = 5;
    // 客户端IP回传拼接
    string client_ip = 6;
    // 广告卡片位置在一刷中的位置, 天马用, 0有含义
    google.protobuf.Int32Value card_index = 7;
    // 广告资源位source 位次
    int32 index = 8;
    // 广告内容
    AdDto ad_content = 9;
}

