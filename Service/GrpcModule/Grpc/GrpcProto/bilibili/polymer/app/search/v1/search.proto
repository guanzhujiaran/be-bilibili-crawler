message TopicItem {
    // 话题id
    int64 id = 1;
    // 标题
    string title = 2;
    // 发布文案
    string publish_text = 3;
    // 参数
    string param = 4;
    // goto
    string goto = 5;
    // 跳转链接
    string uri = 6;
    // linktype
    string linktype = 7;
    // UP主名
    string up_name = 8;
    // 卡片位次
    int32 position = 9;
    // trackid
    string trackid = 10;
    // 内容类型
    int32 content_type = 11;
}

// 百科卡片UI
message PediaCardUI {
    // 背景图
    string background_image = 1;
    // 封面默认颜色
    string cover_default_color = 2;
    // 模块颜色
    string module_color = 3;
    // 蒙层颜色
    string mask_color_value = 4;
    // 蒙层透明度
    string mask_opacity = 5;
    // 高斯模糊值
    string gaussian_blur_value = 6;
}

// 图片导航
message PicNavigation {
    // 标题
    string title = 1;
    // 跳转链接
    string uri = 2;
    // 日间封面
    string cover_sun_url = 3;
    // 夜间封面
    string cover_night_url = 4;
}

// 卡片分组规则
message CardGroupRule {
    // 样式
    int32 style = 1;
    // 是否合并
    bool merge = 2;
}

// 筛选器
message SearchFilter {
    // 筛选样式
    int64 filter_style = 1;
    // 筛选条目列表
    repeated FilterEntries filter_entries = 2;
}

// 筛选条目
message FilterEntries {
    // 标题
    string title = 1;
    // 副标题
    string subtitle = 2;
    // 筛选类型
    string filter_type = 3;
    // 是否单选
    bool single_select = 4;
    // 神经元区域
    string area_for_neuron = 5;
    // 值列表
    repeated FilterValue values = 6;
}

// 筛选值
message FilterValue {
    // 值
    string value = 1;
    // 神经元子模块
    string sub_module_for_neuron = 2;
    oneof filter_param {
        // 分类排序
        CategorySort category_sort = 3;
        // 用户类型
        UserType user_type = 4;
        // 用户排序
        UserSort user_sort = 5;
    }
}// 颜色组
message Colors {
    // 日间
    string color_day = 1;
    // 夜间
    string color_night = 2;
}

// 荣耀信息
message GloryInfo {
    // 标题
    string title = 1;
    // 总数
    int32 total = 2;
    // 条目列表
    repeated GloryItem items = 3;
}

// 荣耀条目
message GloryItem {
    // 标题
    string title = 1;
    // 封面
    string cover = 2;
}
