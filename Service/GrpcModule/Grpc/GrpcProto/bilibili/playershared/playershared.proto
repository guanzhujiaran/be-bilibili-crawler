// 视频生产类型
enum ProductionType {
    // 默认
    PRODUCTION_TYPE_DEFAULT = 0;
    // 用户上传
    PRODUCTION_TYPE_UPLOAD = 1;
    // AI生成
    PRODUCTION_TYPE_AI = 2;
}

// 视频控制信息
message VideoCtrl {
    // 自动清晰度控制
    AutoQnCtl auto_qn_ctl = 1;
    // 清晰度实验
    QnExp qn_exp = 2;
    // 清晰度特性
    string qn_feature = 3;
    // 设备增强
    repeated DeviceEnhance device_enhance = 4;
    // 清晰度覆盖规则
    map<string, QnCoverRules> qn_cover_rules = 5;
}

// 自动清晰度控制
message AutoQnCtl {
    // 已登录半屏
    int64 login_half = 1;
    // 未登录半屏
    int64 nologin_half = 2;
    // 已登录全屏
    int64 login_full = 3;
    // 未登录全屏
    int64 nologin_full = 4;
    // 移动端已登录全屏
    int64 mobile_login_full = 5;
    // 移动端未登录全屏
    int64 mobile_nologin_full = 6;
    // 场景清晰度范围
    map<string, AutoQnRange> scene_qn_range = 7;
}

// 自动清晰度范围
message AutoQnRange {
    // 最大值
    int64 max = 1;
    // 最小值
    int64 min = 2;
}

// 清晰度实验
message QnExp {
    // 实验1
    bool qn_exp_1 = 1;
    // 实验2
    bool qn_exp_2 = 2;
    // 实验3
    QnExpThree qn_exp_3 = 3;
}

// 清晰度实验3
message QnExpThree {
    // 是否开启
    bool qn_exp_3 = 1;
    // sid
    int64 sid = 2;
    // 低屏阈值
    float low_screen_threshold = 3;
}

// 设备增强
message DeviceEnhance {
    // 目标清晰度
    int64 target_qn = 1;
}

// 清晰度覆盖规则
message QnCoverRules {
    // 规则项
    repeated QnCoverRuleItem items = 1;
}

// 清晰度覆盖规则项
message QnCoverRuleItem {
    // 目标清晰度
    int64 target_qn = 1;
    // 解决方案类型
    string solution_type = 2;
    // 解决方案清晰度
    int64 solution_qn = 3;
}

// 多语言信息
message Language {
    // 是否支持
    bool support = 1;
    // 语言列表
    repeated LanguageItem items = 2;
    // 开启提示
    string open_toast = 3;
    // 关闭提示
    string close_toast = 4;
    // 角标
    Badge badge = 5;
    // 默认标题
    string default_title = 6;
    // 列表标题
    string list_title = 7;
    // 列表描述
    string list_desc = 8;
    // 气泡文案
    string bubble_text = 9;
}

// 语言项
message LanguageItem {
    // 语言
    string lang = 1;
    // 标题
    string title = 2;
    // 按钮文案
    string button_title = 3;
    // 字幕语言
    string subtitle_lang = 4;
    // 视频去文字
    bool video_detext = 5;
    // 视频口型变化
    bool video_mouth_shape_change = 6;
    // 生产类型
    ProductionType production_type = 7;
}

// 角标
message Badge {
    // 文案
    string text = 1;
    // 文字颜色
    string text_color = 2;
    // 夜间文字颜色
    string text_color_night = 3;
    // 背景颜色
    string bg_color = 4;
    // 夜间背景颜色
    string bg_color_night = 5;
    // 边框颜色
    string border_color = 6;
    // 夜间边框颜色
    string border_color_night = 7;
    // 背景样式
    int32 bg_style = 8;
}

// 设置组
message SettingGroup {
    // 标题
    string title = 1;
    // 设置项
    repeated SettingItem items = 2;
    // 组样式
    GroupStyle group_style = 3;
}

// 设置项
message SettingItem {
    // 基础信息
    SettingBase base = 1;
    // 样式
    SettingItemStyle style = 2;
    // 值
    oneof value {
        // 更多
        SettingMore more = 3;
        // 竖排
        SettingVertical vertical = 4;
        // 开关
        SettingSwitch switch = 5;
    }
    // 数据
    oneof data {
        // 不感兴趣
        DislikeItem dislike_item = 6;
    }
}

// 设置项基础信息
message SettingBase {
    // 左侧图标
    string left_icon = 1;
    // 左侧标题
    string left_title = 2;
    // 类型
    SettingItemType type = 3;
    // 控制信息
    SettingControl control = 4;
    // 上报参数
    map<string, string> report = 5;
}

// 设置项控制信息
message SettingControl {
    // 是否禁用
    bool disabled = 1;
    // 禁用原因
    string disabled_reason = 2;
    // 禁用置灰
    bool disable_gray = 3;
}

// 更多设置项
message SettingMore {
    // 跳转链接
    string url = 1;
    // 右侧标题
    string right_title = 2;
    // 右侧图标
    string right_icon = 3;
    // 跳转类型
    SettingJumpType jump_type = 4;
    // 是否需要登录
    bool need_login = 5;
    // 角标
    Badge badge = 6;
}

// 竖排设置项
message SettingVertical {
    // 跳转链接
    string url = 1;
    // 跳转类型
    SettingJumpType jump_type = 2;
    // 是否需要登录
    bool need_login = 3;
    // 角标
    Badge badge = 4;
}

// 开关设置项
message SettingSwitch {
    // 角标
    Badge badge = 1;
}

// 不感兴趣项
message DislikeItem {
    // 原因id
    int64 reason_id = 1;
}
