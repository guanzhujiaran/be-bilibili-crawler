// 富文本段落
message Paragraph {
    // 段落类型
    int32 para_type = 1;
    // 段落格式
    ParagraphFormat para_format = 2;
    // 段落内容
    oneof content {
        // 代码
        CodeParagraph code = 3;
        // 分割线
        LineParagraph line = 4;
        // 图片
        PicParagraph pic = 5;
        // 表格
        TableParagraph table = 6;
        // 文本
        TextParagraph text = 7;
        // 链接卡片
        CardParagraph link_card = 8;
    }
    // 跳转链接
    string jump_url = 9;
    // 段落格式
    message ParagraphFormat {
        // 对齐
        int32 align = 1;
        // 列表格式
        ListFormat list_format = 2;
        // 缩进格式
        IndentFormat indent = 3;
        // 标题类型
        int32 heading_type = 4;
        // 基础样式
        ParagraphBaseStyle base_style = 5;
        // 最大行数
        int32 max_lines = 6;
        // 引用间距
        double blockquote_gap = 7;
        // 合并hash
        string combine_hash = 8;
    }
    // 列表格式
    message ListFormat {
        // 层级
        int32 level = 1;
        // 序号
        int32 order = 2;
        // 主题
        string theme = 3;
        // 序号样式
        int32 order_style = 4;
    }
    // 缩进格式
    message IndentFormat {
        // 缩进
        double indent = 1;
        // 首行缩进
        double first_line_indent = 2;
    }
    // 基础样式
    message ParagraphBaseStyle {
        // 字号
        double font_size = 1;
        // 字重
        int32 font_weight = 2;
        // 字体颜色
        Colors font_color = 3;
    }
}

// 颜色组
message Colors {
    // 日间
    string day = 1;
    // 夜间
    string night = 2;
}

// 富文本
message TextParagraph {
    // 节点列表
    repeated TextNode nodes = 1;
}

// 富文本节点
message TextNode {
    // 节点类型
    int32 node_type = 1;
    // 原始文本
    string raw_text = 2;
    // 节点内容
    oneof text {
        // 词
        Word word = 3;
        // 链接
        Link link = 4;
        // 表情
        Emote emote = 5;
        // 公式
        Formula formula = 6;
    }
    // 词
    message Word {
        // 文本
        string words = 1;
        // 样式
        int32 style = 2;
    }
    // 链接
    message Link {
        // 链接
        string link = 1;
        // 文本
        string words = 2;
        // 展示文本
        string show_text = 3;
    }
    // 表情
    message Emote {
        // 表情id
        int64 id = 1;
        // 表情名
        string text = 2;
        // 表情url
        string url = 3;
        // 表情大小
        int32 size = 4;
        // gif url
        string gif_url = 5;
    }
    // 公式
    message Formula {
        // 公式内容
        string content = 1;
    }
}

// 代码段落
message CodeParagraph {
    // 代码内容
    string content = 1;
    // 语言
    string lang = 2;
}

// 分割线段落
message LineParagraph {
    // 样式
    string style = 1;
}

// 图片段落
message PicParagraph {
    // 图片列表
    repeated MdlDynDrawItem pics = 1;
    // 样式
    int32 style = 2;
}

// 表格段落
message TableParagraph {
    // 表格内容
    string content = 1;
}

// 链接卡片段落
message CardParagraph {
    // 卡片url
    string url = 1;
    // 卡片标题
    string title = 2;
}

// 折叠类型
enum FoldType {
    FoldTypeZore = 0;     // 占位
    FoldTypePublish = 1;  // 用户发布折叠
    FoldTypeFrequent = 2; // 转发超频折叠
    FoldTypeUnite = 3;    // 联合投稿折叠
    FoldTypeLimit = 4;    // 动态受限折叠
}

