syntax = "proto3";

// Deprecated
package bilibili.dynamic.gateway;

import "bilibili/account/service/v1/service.proto";
import "bilibili/dagw/component/avatar/v1/avatar.proto";
import "bilibili/vas/garb/service/card.proto";
import "google/protobuf/any.proto";

// 综合页请求广告所需字段，由客户端-网关透传
message AdParam {
    // 综合页请求广告所需字段，由客户端-网关透传
    string ad_extra = 1;
    // request_id
    string request_id = 2;
}

//
enum AddButtonBgStyle {
    fill = 0;   // 默认填充
    stroke = 1; // 描边
    gray = 2;   // 置灰
}

// 按钮类型
enum AddButtonType {
    bt_none = 0;   // 占位
    bt_jump = 1;   // 跳转
    bt_button = 2; // 按钮
}

// 动态-附加卡-通用卡
message AdditionCommon {
    // 头部说明文案
    string head_text = 1;
    // 标题
    string title = 2;
    // 展示图
    string image_url = 3;
    // 描述文字1
    string desc_text_1 = 4;
    // 描述文字2
    string desc_text_2 = 5;
    // 点击跳转链接
    string url = 6;
    // 按钮
    AdditionalButton button = 7;
    // 头部icon
    string head_icon = 8;
    // style
    ImageStyle style = 9;
    // 动态本身的类型 type
    string type = 10;
    // 附加卡类型
    string card_type = 11; // ogv manga
    // 角标
    string badge = 12;
}

// 动态-附加卡-电竞卡
message AdditionEsport {
    // 电竞类型
    EspaceStyle style = 1;
    oneof item {
        // moba类
        AdditionEsportMoba addition_esport_moba = 2;
    }
    // 动态本身的类型 type
    string type = 3;
    // 附加卡类型
    string card_type = 4; // ogv manga
}

// 动态-附加卡-电竞卡-moba类
message AdditionEsportMoba {
    // 头部说明文案
    string head_text = 1;
    // 标题
    string title = 2;
    // 战队列表
    repeated MatchTeam match_team = 3;
    // 比赛信息
    AdditionEsportMobaStatus addition_esport_moba_status = 4;
    // 卡片跳转
    string uri = 5;
    // 按钮
    AdditionalButton button = 6;
    // 副标题
    string sub_title = 7;
    // 动态本身的类型 type
    string type = 10;
    // 附加卡类型
    string card_type = 11;
}

// 动态-附加卡-电竞卡-moba类-比赛信息
message AdditionEsportMobaStatus {
    // 文案类
    repeated AdditionEsportMobaStatusDesc addition_esport_moba_status_desc = 1;
    // 比赛状态文案
    string title = 2;
    // 比赛状态状态
    int32 status = 3;
    // 日间色值
    string color = 4;
    // 夜间色值
    string night_color = 5;
}

// 动态-附加卡-电竞卡-moba类-比赛信息-文案类
message AdditionEsportMobaStatusDesc {
    // 文案
    string title = 1;
    // 日间色值
    string color = 2;
    // 夜间色值
    string night_color = 3;
}

// 动态-附加卡-商品卡
message AdditionGoods {
    // 推荐文案
    string rcmd_desc = 1;
    // 商品信息
    repeated GoodsItem goods_items = 2;
    // 附加卡类型
    string card_type = 3;
    // 头部icon
    string icon = 4;
    // 商品附加卡整卡跳转
    string uri = 5;
    // 商品类型
    // 1:淘宝 2:会员购，注：实际是获取的goods_items里面的第一个source_type
    int32 source_type = 6;
}

// up主预约发布卡
message AdditionUP {
    // 标题
    string title = 1;
    // 高亮文本，描述文字1
    HighlightText desc_text_1 = 2;
    // 描述文字2
    string desc_text_2 = 3;
    // 点击跳转链接
    string url = 4;
    // 按钮
    AdditionalButton button = 5;
    // 附加卡类型
    string card_type = 6;
    // 预约人数(用于预约人数变化)
    int64 reserve_total = 7;
    // 活动皮肤
    AdditionalActSkin act_skin = 8;
    // 资源id
    int64 rid = 9;
    // 抽奖类型
    int32 lottery_type = 10;
    // 描述文字3
    HighlightText desc_text_3 = 11;
    // UP主mid
    int64 up_mid = 12;
    // UP主信息
    AdditionUserInfo user_info = 13;
    // 动态id
    string dynamic_id = 14;
    // 是否展示描述文字2
    bool show_text_2 = 15;
    // 动态类型
    int64 dyn_type = 16;
    // 业务id
    string business_id = 17;
    // 角标文案
    string badge_text = 18;
    // 是否首播
    bool is_premiere = 19;
}

// 动态-附加卡-UGC视频附加卡
message AdditionUgc {
    // 说明文案
    string head_text = 1;
    // 稿件标题
    string title = 2;
    // 封面
    string cover = 3;
    // 描述文字1
    string desc_text_1 = 4;
    // 描述文字2
    string desc_text_2 = 5;
    // 接秒开
    string uri = 6;
    // 时长
    string duration = 7;
    // 标题支持换行-标题支持单行和双行，本期不支持填充up昵称，支持双行展示，字段默认为true
    bool line_feed = 8;
    // 附加卡类型
    string card_type = 9;
}

// 动态-附加卡-投票
message AdditionVote {
    // 封面图
    string image_url = 1;
    // 标题
    string title = 2;
    // 展示项1
    string text_1 = 3;
    // button文案
    string button_text = 4;
    // 点击跳转链接
    string url = 5;
}

// 动态模块-投票
message AdditionVote2 {
    // 投票类型
    AdditionVoteType addition_vote_type = 1;
    // 投票ID
    int64 vote_id = 2;
    // 标题
    string title = 3;
    // 已过期： xxx人参与· 投票已过期。button 展示去查看
    // 未过期： xxx人参与· 剩xx天xx时xx分。button展示去投票
    string label = 4;
    // 剩余时间
    int64 deadline = 5;
    // 生效文案
    string open_text = 6;
    // 过期文案
    string close_text = 7;
    // 已投票
    string voted_text = 8;
    // 投票状态
    AdditionVoteState state = 9;
    // 投票信息
    oneof item {
        //
        AdditionVoteWord addition_vote_word = 10;
        //
        AdditionVotePic addition_vote_pic = 11;
        //
        AdditionVoteDefaule addition_vote_defaule = 12;
    }
    // 业务类型
    // 0:动态投票 1:话题h5组件
    int32 biz_type = 13;
    // 投票总人数
    int64 total = 14;
    // 附加卡类型
    string card_type = 15;
    // 异常提示
    string tips = 16;
    // 跳转地址
    string uri = 17;
    // 是否投票
    bool is_voted = 18;
    // 投票最多多选个数，单选为1
    int32 choice_cnt = 19;
    // 是否默认选中分享到动态
    bool defaule_select_share = 20;
    // 仅粉丝投票属性
    OnlyFansVoteProperty only_fans_vote = 21;
    // 投票发起人mid
    int64 vote_owner_mid = 22;
    // 角标
    string badge = 23;
    // 描述
    string desc = 24;
}

// 仅粉丝投票属性
message OnlyFansVoteProperty {
    // 是否仅粉丝投票
    bool is_only_fans_vote = 1;
    // 是否有投票权限
    bool has_vote_permission = 2;
    // 按钮文案
    string vote_btn_text = 3;
    // 按钮链接
    string vote_btn_uri = 4;
    // 注释文案1
    string vote_annotation_part_1 = 5;
    // 注释文案2
    string vote_annotation_part_2 = 6;
}

// 预约UP主信息
message AdditionUserInfo {
    // 用户名
    string name = 1;
    // 头像
    string face = 2;
}

// 外露投票
message AdditionVoteDefaule {
    // 图片 多张
    repeated string cover = 1;
}

// 外露图片类型
message AdditionVotePic {
    // 图片投票详情
    repeated AdditionVotePicItem item = 1;
}

// 图片投票详情
message AdditionVotePicItem {
    // 选项索引，从1开始
    int32 opt_idx = 1;
    // 图片
    string cover = 2;
    // 选中状态
    bool is_vote = 3;
    // 人数
    int32 total = 4;
    // 占比
    double persent = 5;
    // 标题文案
    string title = 6;
    // 是否投票人数最多的选项
    bool  is_max_option = 7;
}

// 投票状态
enum AdditionVoteState {
    addition_vote_state_none = 0;  //
    addition_vote_state_open = 1;  //
    addition_vote_state_close = 2; //
}

// 投票类型
enum AdditionVoteType {
    addition_vote_type_none = 0;    //
    addition_vote_type_word = 1;    //
    addition_vote_type_pic = 2;     //
    addition_vote_type_default = 3; //
}

// 外露文字类型
message AdditionVoteWord {
    // 外露文字投票详情
    repeated AdditionVoteWordItem item = 1;
}

// 外露文字投票详情
message AdditionVoteWordItem {
    // 选项索引，从1开始
    int32 opt_idx = 1;
    // 文案
    string title = 2;
    // 选中状态
    bool is_vote = 3;
    // 人数
    int32 total = 4;
    // 占比
    double persent = 5;
    // 是否投票人数最多的选项
    bool  is_max_option = 6;
}

// 活动皮肤
message AdditionalActSkin {
    // 动画SVGA资源
    string svga = 1;
    // 动画SVGA最后一帧图片资源
    string last_image = 2;
    // 动画播放次数
    int64 play_times = 3;
}

// 动态-附加卡-按钮
message AdditionalButton {
    // 按钮类型
    AddButtonType type = 1;
    // jump-跳转样式
    AdditionalButtonStyle jump_style = 2;
    // jump-跳转链接
    string jump_url = 3;
    // button-未点样式
    AdditionalButtonStyle uncheck = 4;
    // button-已点样式
    AdditionalButtonStyle check = 5;
    // button-当前状态
    AdditionalButtonStatus status = 6;
    // 按钮点击样式
    AdditionalButtonClickType click_type = 7;
}

// 附加卡按钮点击类型
enum AdditionalButtonClickType {
    click_none = 0; // 通用按钮
    click_up = 1;   // 预约卡按钮
}

message AdditionalButtonInteractive {
    // 是否弹窗
    string popups = 1;
    // 弹窗确认文案
    string confirm = 2;
    // 弹窗取消文案
    string cancel = 3;
    //
    string desc = 4;
}

//
enum AdditionalButtonStatus {
    none = 0;    //
    uncheck = 1; //
    check = 2;   //
}

// 动态-附加卡-按钮样式
message AdditionalButtonStyle {
    // icon
    string icon = 1;
    // 文案
    string text = 2;
    // 按钮点击交互
    AdditionalButtonInteractive interactive = 3;
    // 当前按钮填充样式
    AddButtonBgStyle bg_style = 4;
    // toast文案, 当disable=1时有效
    string toast = 5;
    // 当前按钮样式,
    // 0:高亮 1:置灰(按钮不可点击)
    DisableState disable = 6;
}

// 动态-附加卡-番剧卡
message AdditionalPGC {
    // 头部说明文案
    string head_text = 1;
    // 标题
    string title = 2;
    // 展示图
    string image_url = 3;
    // 描述文字1
    string desc_text_1 = 4;
    // 描述文字2
    string desc_text_2 = 5;
    // 点击跳转链接
    string url = 6;
    // 按钮
    AdditionalButton button = 7;
    // 头部icon
    string head_icon = 8;
    // style
    ImageStyle style = 9;
    // 动态本身的类型 type
    string type = 10;
}

// 枚举-动态附加卡
enum AdditionalType {
    additional_none = 0;                // 占位
    additional_type_pgc = 1;            // 附加卡-追番
    additional_type_goods = 2;          // 附加卡-商品
    additional_type_vote = 3;           // 附加卡投票
    additional_type_common = 4;         // 附加通用卡
    additional_type_esport = 5;         // 附加电竞卡
    additional_type_up_rcmd = 6;        // 附加UP主推荐卡
    additional_type_ugc = 7;            // 附加卡-ugc
    additional_type_up_reservation = 8; // UP主预约卡
}

// 动态卡片列表
message CardVideoDynList {
    // 动态列表
    repeated DynamicItem list = 1;
    // 更新的动态数
    int64 update_num = 2;
    // 历史偏移
    string history_offset = 3;
    // 更新基础信息
    string update_baseline = 4;
    // 是否还有更多数据
    bool has_more = 5;
}

// 视频页-我的追番
message CardVideoFollowList {
    // 查看全部(跳转链接)
    string view_all_link = 1;
    // 追番列表
    repeated FollowListItem list = 2;
}

// 视频页-最近访问
message CardVideoUpList {
    // 标题展示文案
    string title = 1;
    // up主列表
    repeated UpListItem list = 2;
    // 服务端生成的透传上报字段
    string footprint = 3;
    // 直播数
    int32 show_live_num = 4;
    // 跳转label
    UpListMoreLabel more_label = 5;
    // 标题开关(综合页)
    int32 title_switch = 6;
    // 是否展示右上角查看更多label
    bool show_more_label = 7;
    // 是否在快速消费页查看更多按钮
    bool show_in_personal = 8;
    // 是否展示右侧查看更多按钮
    bool show_more_button = 9;
    // 是否还有更多列表数据
    bool has_more_list = 10;
    // 第二列表
    repeated UpListItem list_second = 11;
    // 查看更多列表偏移
    string more_list_offset = 12;
}

// 评论外露展示项
message CmtShowItem {
    // 用户mid
    int64 uid = 1;
    // 用户昵称
    string uname = 2;
    // 点击跳转链接
    string uri = 3;
    // 评论内容
    string comment = 4;
}

// 装扮卡片-粉丝勋章信息
message DecoCardFan {
    // 是否是粉丝
    int32 is_fan = 1;
    // 数量
    int32 number = 2;
    // 数量 str
    string number_str = 3;
    // 颜色
    string color = 4;
}

// 装扮卡片
message DecorateCard {
    // 装扮卡片id
    int64 id = 1;
    // 装扮卡片链接
    string card_url = 2;
    // 装扮卡片点击跳转链接
    string jump_url = 3;
    // 粉丝样式
    DecoCardFan fan = 4;
    // 装扮卡片信息
    bilibili.vas.garb.service.UserCard vas_deco_card = 5;
}

// 文本类型
enum DescType {
    desc_type_none = 0;         // 占位
    desc_type_text = 1;         // 文本
    desc_type_aite = 2;         // @
    desc_type_lottery = 3;      // 抽奖
    desc_type_vote = 4;         // 投票
    desc_type_topic = 5;        // 话题
    desc_type_goods = 6;        // 商品
    desc_type_bv = 7;           // bv
    desc_type_av = 8;           // av
    desc_type_emoji = 9;        // 表情
    desc_type_user = 10;        // 外露用户
    desc_type_cv   = 11;        // 专栏
    desc_type_vc   = 12;        // 小视频
    desc_type_web  = 13;        // 网址
    desc_type_taobao  = 14;     // 淘宝
    desc_type_mail = 15;        // 邮箱
    desc_type_ogv_season = 16;  // 番剧season
    desc_type_ogv_ep = 17;      // 番剧ep
}

// 文本描述
message Description {
    // 文本内容
    string text = 1;
    // 文本类型
    DescType type = 2;
    // 点击跳转链接
    string uri = 3;
    // emoji类型
    EmojiType emoji_type = 4;
    // 商品类型
    string goods_type = 5;
    // 前置Icon
    string icon_url = 6;
    // icon_name
    string icon_name = 7;
    // 资源ID
    string rid = 8;
    // 商品卡特殊字段
    ModuleDescGoods goods = 9;
    // 文本原始文案
    string orig_text = 10;
    // emoji尺寸
    int32 emoji_size = 11;
    // emoji尺寸描述
    EmojiSizeSpec emoji_size_spec = 12;
}

// emoji尺寸描述
message EmojiSizeSpec {
    // 宽
    int64 width = 1;
}

// 尺寸信息
message Dimension {
    //
    int64 height = 1;
    //
    int64 width = 2;
    //
    int64 rotate = 3;
}

//
enum DisableState {
    highlight = 0; // 高亮
    gary = 1;      // 置灰(按钮不可点击)
}

// 动态通用附加卡-follow/取消follow-响应
message DynAdditionCommonFollowReply {
    //
    AdditionalButtonStatus status = 1;
}

// 动态通用附加卡-follow/取消follow-请求
message DynAdditionCommonFollowReq {
    //
    AdditionalButtonStatus status = 1;
    //
    string dyn_id = 2;
    //
    string card_type = 3;
}

// 最近访问-个人feed流列表-返回
message DynAllPersonalReply {
    // 动态列表
    repeated DynamicItem list = 1;
    // 偏移量
    string offset = 2;
    // 是否还有更多数据
    bool has_more = 3;
    // 已读进度
    string read_offset = 4;
    // 关注状态
    Relation relation = 5;
}

// 最近访问-个人feed流列表-请求
message DynAllPersonalReq {
    // 被访问者的 UID
    int64 host_uid = 1;
    // 偏移量 第一页可传空
    string offset = 2;
    // 标明下拉几次
    int32 page = 3;
    // 是否是预加载 默认是1；客户端预加载。1：是预加载，不更新已读进度，不会影响小红点；0：非预加载，更新已读进度
    int32 is_preload = 4;
    // 秒开参数 新版本废弃，统一使用player_args
    PlayurlParam playurl_param = 5;
    // 客户端时区 兼容UTC-14和Etc/GMT+12,时区区间[-12,14] 东八区为8
    int32 local_time = 6;
    // 服务端生成的透传上报字段
    string footprint = 7;
    // 来源
    string from = 8;
    // 秒开用
    PlayerArgs player_args = 9;
}

// 动态综合页-响应
message DynAllReply {
    // 卡片列表
    DynamicList dynamic_list = 1;
    // 顶部up list
    CardVideoUpList up_list = 2;
    // 话题广场
    TopicList topic_list = 3;
    // 无关注推荐
    Unfollow unfollow = 4;
    // 分区推荐
    DynRegionRcmd region_rcmd = 5;
    // 配置
    Config config = 6;
    // 排序配置
    FeedSortConfig sort_config = 7;
}

// 配置
message Config {
    // 详情查看位
    int64 detail_view_bits = 1;
    // 竖屏示例开关
    bool story_vertical_exp = 2;
    // 路由kv
    map<string, string> extra_router_kvs = 3;
}

// 分区推荐
message DynRegionRcmd {
    // 资源id
    int64 rid = 1;
    // 标题
    string title = 2;
    // 推荐模块列表
    repeated ModuleRcmd items = 3;
    // 推荐选项
    RcmdOption opts = 4;
}

// 分区推荐条目
message DynRegionRcmdItem {
    // 资源id
    int64 rid = 1;
    // 标题
    string title = 2;
    // 模块列表
    repeated ModuleRcmd items = 3;
}

// 推荐选项
message RcmdOption {
    // 展示标题
    bool show_title = 1;
}

// 排序配置
message FeedSortConfig {
    // 标题
    string title = 1;
    // 排序选项列表
    repeated FeedSortOption sort_options = 2;
}

// 排序选项
message FeedSortOption {
    // 排序名
    string sort_name = 1;
    // 排序类型
    string sort_type = 2;
    // 是否选中
    bool is_selected = 3;
    // 不自动翻页
    bool no_auto_next_page_when_unsatisfied = 4;
}

// 推荐模块
message ModuleRcmd {
    // 模块列表
    repeated Module module = 1;
}

// 推荐作者信息
message RcmdAuthor {
    // 用户信息
    UserInfo author = 1;
    // 描述
    string desc = 2;
    // 关注关系
    Relation relation = 3;
}

// 推荐条目
message RcmdItem {
    // 类型
    int32 type = 1;
    // 推荐内容
