    int64 expire = 4;
}

// 角标信息
message VideoBadge {
    // 文案
    string text = 1;
    // 文案颜色-日间
    string text_color = 2;
    // 文案颜色-夜间
    string text_color_night = 3;
    // 背景颜色-日间
    string bg_color = 4;
    // 背景颜色-夜间
    string bg_color_night = 5;
    // 边框颜色-日间
    string border_color = 6;
    // 边框颜色-夜间
    string border_color_night = 7;
    // 样式
    int32 bg_style = 8;
    // 背景透明度-日间
    int32 bg_alpha = 9;
    // 背景透明度-夜间
    int32 bg_alpha_night = 10;
    // 头部图标
    string head_icon = 11;
    // 本地头部图标
    int32 head_icon_local = 12;
}

// 番剧类型
enum VideoSubType {
    VideoSubTypeNone = 0;        // 没有子类型
    VideoSubTypeBangumi = 1;     // 番剧
    VideoSubTypeMovie = 2;       // 电影
    VideoSubTypeDocumentary = 3; // 纪录片
    VideoSubTypeDomestic = 4;    // 国创
    VideoSubTypeTeleplay = 5;    // 电视剧
}

// 视频类型
enum VideoType {
    video_type_general = 0;  //普通视频
    video_type_dynamic = 1;  //动态视频
    video_type_playback = 2; //直播回放视频
}

// 大会员信息
message VipInfo {
    // 大会员类型
    int32 Type = 1;
    // 大会员状态
    int32 status = 2;
    // 到期时间
    int64 due_date = 3;
    // 标签
    VipLabel label = 4;
    // 主题
    int32 theme_type = 5;
    // 大会员角标
    // 0:无角标 1:粉色大会员角标 2:绿色小会员角标
    int32 avatar_subscript = 6;
    // 昵称色值，可能为空，色值示例：#FFFB9E60
    string nickname_color = 7;
}

// 大会员标签
message VipLabel {
    // 图片地址
    string path = 1;
    // 文本值
    string text = 2;
    // 对应颜色类型
    string label_theme = 3;
}

// 状态
enum VoteStatus {
    normal = 0;    // 正常
    anonymous = 1; // 匿名
}

// 提权样式
message Weight {
    // 提权展示标题
    string title = 1;
    // 下拉框内容
    repeated WeightItem items = 2;
    // icon
    string icon = 3;
}

// 热门默认跳转按钮
message WeightButton {
    string jump_url = 1;
    // 展示文案
    string title = 2;
}

// 提权不感兴趣
message WeightDislike {
    // 负反馈业务类型 作为客户端调用负反馈接口的参数
    string feed_back_type = 1;
    // 展示文案
    string title = 2;
}

// 提权样式
message WeightItem {
    // 类型
    WeightType type = 1;
    oneof item {
        // 热门默认跳转按钮
        WeightButton button = 2;
        // 提权不感兴趣
        WeightDislike dislike = 3;
    }
}

// 枚举-提权类型
enum WeightType {
    weight_none = 0;    // 默认 占位
    weight_dislike = 1; // 不感兴趣
    weight_jump = 2;    // 跳链
}
