import "bilibili/pagination/pagination.proto";
import "bilibili/playershared/playershared.proto";
import "google/protobuf/any.proto";

// 统一视频信息接口 (7.41.0+)
service View {
    // 
    rpc ArcRefresh(ArcRefreshReq) returns (ArcRefreshReply);
    // 视频详情页下方推荐
    rpc RelatesFeed(RelatesFeedReq) returns (RelatesFeedReply);
    // 
    rpc View(ViewReq) returns (ViewReply);
    //
    rpc ViewProgress(ViewProgressReq) returns (ViewProgressReply);
    // AI相关异步
    rpc AIRelateAsync(AIRelateAsyncReq) returns (AIRelateAsyncReply);
    // 缓存鉴权
    rpc CacheAuthentication(CacheAuthenticationReq) returns (CacheAuthenticationReply);
    // 广告搜索
    rpc FloorAdSearch(FloorAdSearchReq) returns (FloorAdSearchReply);
    // 分P
    rpc Pages(PagesReq) returns (PagesReply);
    // 播放暂停
    rpc PlayPause(PlayPauseReq) returns (PlayPauseReply);
    // 故事模式
    rpc Story(StoryReq) returns (StoryReply);
    // 视频提及
    rpc VideoMentions(VideoMentionsReq) returns (VideoMentionsReply);
    // 播放页结束页
    rpc ViewEndPage(ViewEndPageReq) returns (ViewEndPageReply);
}

