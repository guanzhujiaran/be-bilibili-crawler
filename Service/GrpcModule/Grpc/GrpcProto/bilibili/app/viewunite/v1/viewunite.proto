    int64 sort_desc = 7;
    // 排序字段
    int64 sort_field = 8;
}

// 故事模式请求
message StoryReq {
    // 稿件avid
    int64 aid = 1;
    // 稿件bvid
    string bvid = 2;
    // 播放器参数
    bilibili.app.archive.middleware.v1.PlayerArgs player_args = 3;
    oneof param {
        // 故事模式请求参数
        StoryReqParam story_req_param = 4;
        // 播单请求参数
        PlayListReqParam play_list_req_param = 5;
    }
    // 下拉
    int64 pull = 6;
    // 来源
    string from = 7;
    // 当前页面spmid
    string spmid = 8;
    // 上一页面spmid
    string from_spmid = 9;
    // 广告额外参数
    string ad_extra = 10;
    // 是否可折叠
    bool foldable = 11;
}

// 播放暂停请求
message PlayPauseReq {
    // 稿件avid
    int64 aid = 1;
    // 稿件cid
    int64 cid = 2;
    // Tab类型
    TabType tab_type = 3;
    // 业务额外参数
    string biz_extra = 4;
    // 广告额外参数
    string ad_extra = 5;
    // 额外内容
    map<string, string> extra_content = 6;
    // 会话ID
    string session_id = 7;
}

// 视频提及请求
message VideoMentionsReq {
    // 视频请求参数
    string video_req = 1;
    // 稿件avid
    int64 aid = 2;
    // 当前页面spmid
    string spmid = 3;
    // 上一页面spmid
    string from_spmid = 4;
    // 上一页面追踪ID
    string from_trackid = 5;
    // 来源场景
    string from_scene = 6;
    // 业务额外参数
    string biz_extra = 7;
    // 额外内容
    map<string, string> extra_content = 8;
}

// 播放页结束页请求
message ViewEndPageReq {
    // 稿件avid
    int64 aid = 1;
    // 稿件bvid
    string bvid = 2;
    // 来源
    string from = 3;
    // 当前页面spmid
    string spmid = 4;
    // 上一页面spmid
    string from_spmid = 5;
    // 会话ID
    string session_id = 6;
    // 相关视频ID列表
    repeated RelateID relate_ids = 7;
    // 追踪ID
    string track_id = 8;
    // 额外内容
    map<string, string> extra_content = 9;
    // 广告额外参数
    string ad_extra = 10;
    // 播放器参数
    bilibili.app.archive.middleware.v1.PlayerArgs player_args = 11;
}

// 缓存播放稿件
message CachePlayAv {
    // 稿件avid
    int64 aid = 1;
}

// AI相关异步请求
message AIRelateAsyncReq {
    // 视频信息请求
    ViewReq req = 1;
    // AI相关异步参数
    bilibili.app.viewunite.common.RelateAsync relate_async = 2;
}

// 缓存鉴权请求
message CacheAuthenticationReq {
    // 缓存播放稿件列表
    repeated CachePlayAv av = 1;
}

// 缓存鉴权回复
message CacheAuthenticationReply {
    // 缓存结果映射
    map<int64, CachePlayAvRly> item = 1;
}

// 分P回复
message PagesReply {
    // 分P列表
    repeated bilibili.app.viewunite.common.Page pages = 1;
}

// 缓存播放稿件鉴权结果
message CachePlayAvRly {
    // 鉴权结果码
    CacheCode code = 1;
}

// 异步模块
message AsyncModule {
    // 模块列表
    repeated bilibili.app.viewunite.common.Module modules = 1;
}

// 暂停类型
enum PauseType {
    // 默认
    PAUSE_TYPE_DEFAULT = 0;
    // 广告
    PAUSE_TYPE_ADS = 1;
}

// 缓存鉴权结果码
enum CacheCode {
    // 可播放
    PLAY = 0;
    // 未开通
    UPOWERSTATE_INACTIVE = 100;
    // 重复上次操作
    REPEAT_LAST_OPERATION = 101;
}

// 广告搜索项
message FloorAdSearchItem {
    // 内容
    google.protobuf.Any source_content = 1;
}

// 广告搜索Tab
message FloorAdSearchTab {
    // 标题
    string title = 1;
    // 按钮标题
    string but_title = 2;
    // 按钮链接
    string but_url = 3;
}

// 广告搜索回复
message FloorAdSearchReply {
    // Tab信息
    FloorAdSearchTab tab = 1;
    // 广告搜索项列表
    repeated FloorAdSearchItem item = 3;
}

// AI相关异步回复
message AIRelateAsyncReply {
    // 广告信息
    CM cm = 1;
    // 异步模块
    AsyncModule module = 2;
    // 补充内容
    google.protobuf.Any supplement = 3;
}

// 文本信息
message TextInfo {
    // 文本
    string text = 1;
    // 文本颜色
    string text_color = 2;
    // 夜间文本颜色
    string text_color_night = 3;
    // 字号
    int32 font_size = 4;
}

// 按钮动作类型
enum ButtonAction {
    // 默认
    BUTTON_ACTION_DEFAULT = 0;
    // 取消
    BUTTON_ACTION_CANCEL = 1;
}

// 按钮信息
message ButtonInfo {
    // 文本
    string text = 1;
    // 文本颜色
    string text_color = 2;
    // 夜间文本颜色
    string text_color_night = 3;
    // 背景颜色
    string bg_color = 4;
    // 夜间背景颜色
    string bg_color_night = 5;
    // 动作类型
    ButtonAction action_type = 6;
    // 字号
    int32 font_size = 7;
    // 边框颜色
    string frame_color = 8;
}

// 暂停广告稿件
message PauseAdsAV {
    // 稿件avid
    int64 aid = 1;
    // 统计数据
    bilibili.app.viewunite.common.Stat stat = 2;
    // 封面
    string cover = 3;
    // 标题
    string title = 4;
    // 时长
    int64 duration = 5;
}

// 暂停广告内容列表
message PauseSourceContentList {
    // 内容
    google.protobuf.Any source_content = 1;
    // 广告稿件列表
    repeated PauseAdsAV av = 2;
}

// 暂停广告
message PauseAds {
    // 内容列表
    repeated PauseSourceContentList list = 1;
}

// 暂停信息
message PauseBar {
    // 标题
    TextInfo title = 1;
    // 倒计时时长
    int64 timer_countdown = 2;
    // 是否开启倒计时
    bool countdown_enable = 3;
    // 按钮列表
    repeated ButtonInfo button = 6;
}

// 播放暂停回复
message PlayPauseReply {
    // 暂停类型
    PauseType type = 1;
    // 暂停信息
    PauseBar bar = 2;
    oneof data {
        // 暂停广告
        PauseAds ads = 3;
    }
}

// 视频提及回复
message VideoMentionsReply {
    // 提及列表
    repeated bilibili.app.viewunite.common.Mention mentions = 1;
    // 标题
    string title = 2;
    // AB实验
    map<string, string> ab = 3;
}

// 视频播放数据
message VideoPlayData {
    // 播放地址
    string url = 1;
    // 分辨率
    bilibili.playershared.Dimension dimension = 2;
    // 稿件avid
    int64 aid = 3;
    // 剧集epid
    int64 ep_id = 4;
    // 稿件cid
    int64 cid = 5;
}

// 故事模式广告信息
message StoryAdInfo {
    // 创意ID
    int64 creative_id = 1;
    // 广告回调
    string ad_cb = 2;
    // 资源
    int64 resource = 3;
    // 来源
    int32 source = 4;
    // 请求ID
    string request_id = 5;
    // 是否广告
    bool is_ad = 6;
    // 是否本地广告
    bool is_ad_loc = 7;
    // 客户端IP
    string client_ip = 8;
    // 额外信息
    string extra = 9;
    // 广告类型
    int32 advertise_type = 10;
}

// PGC信息
message PGCInfo {
    // 会员付费提示
    string vip_pay_tip = 1;
}

// 故事模式视频卡片
message StoryVideoCard {
    // 播放数据
    VideoPlayData play_data = 1;
    // 视频详情
    ViewReply view_content = 2;
    // 推荐会话ID
    string recommend_session_id = 3;
    // 封面
    string cover = 4;
    // 追踪ID
    string track_id = 5;
    // 跳转类型
    string goto = 6;
    // PGC信息
    PGCInfo pgc_info = 7;
    // 广告信息
    StoryAdInfo ad_info = 8;
}

// 故事模式卡片包装
message StoryActualCardWrapper {
    oneof actual_card {
        // 视频卡片
        StoryVideoCard video_card = 1;
    }
}

// 故事模式回复
message StoryReply {
    // 故事卡片列表
    repeated StoryActualCardWrapper story_card_wrappers = 1;
}

// 结束页广告类型
enum EndCmType {
    // 默认
    END_CM_DEFAULT = 0;
    // 半屏
    END_CM_HALF = 1;
}

// 结束页半屏信息
message ViewEndHalf {
    // 暂停类型
    PauseType type = 1;
    oneof data {
        // 暂停广告
        PauseAds ads = 2;
    }
}

// 结束页卡片
message ViewEndPageCard {
    // 相关推荐
    bilibili.app.viewunite.common.RelateCard relate = 1;
    // 卡片索引
    int64 card_index = 2;
}

// 播放页结束页回复
message ViewEndPageReply {
    // 相关推荐卡片列表
    repeated ViewEndPageCard relates = 1;
    // 半屏信息
    ViewEndHalf half = 2;
    // 结束页广告类型
    EndCmType type = 3;
}
