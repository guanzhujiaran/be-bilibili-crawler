syntax = "proto3";

package bilibili.app.playerunite.pugvanymodel;

// 
enum EpisodeStatus {
    EPISODE_STATUS_UNSPECIFIED = 0;
    EPISODE_STATUS_TRY_WATCH_WHOLE = 1;
    EPISODE_STATUS_NOT_TRY_WATCH = 2;
    EPISODE_STATUS_TRY_WATCH_5_MINUTES = 3;
}

// 
message PlayerMask {
    // 
    string title = 1;
    // 
    string prefix = 2;
    // 
    string suffix = 3;
}

// 
message PUGVAnyModel {
    // 
    int64 season_id = 1;
    // 
    int64 episode_id = 2;
    // 
    EpisodeStatus status = 3;
    // 
    RiskControl risk_control = 4;
    // 
    PlayerMask player_mask = 5;
    // 剪辑片段信息
    ClipInfo clip_info = 6;
    // 播放限制
    PlayLimit play_limit = 7;
    // 学习记录配置
    StudyRecordConfig study_record_config = 8;
    // 水印配置
    WatermarkConfig watermark_config = 9;
}

// 
message RiskControl {
    // 
    bool need_send_sms = 1;
    // 
    string title = 2;
    // 
    string risk_message = 3;
    // 
    string action_desc = 4;
    // 
    string send_sms_url = 5;
    // 
    string buvid = 6;
}

// 剪辑类型
enum ClipType {
    // 未指定
    CLIP_TYPE_UNSPECIFIED = 0;
    // HE
    CLIP_TYPE_HE = 1;
}

// 剪辑片段信息
message ClipInfo {
    // 剪辑类型
    ClipType clip_type = 1;
    // 素材编号
    int64 material_no = 2;
    // 开始时间
    int32 start = 3;
    // 结束时间
    int32 end = 4;
}

// 学习类型
enum StudyType {
    // 普通
    NORMAL = 0;
    // 健身
    FITNESS = 1;
}

// 结课页配置
message EndingPageConfig {
    // 图片
    string image = 1;
    // 完成标题
    string complete_title = 2;
    // 缺失提示
    string lacking_message = 3;
    // 详情提示
    string detail_message = 4;
}

// 学习记录配置
message StudyRecordConfig {
    // 是否开启记录
    bool record_enable = 1;
    // 学习类型
    StudyType study_type = 2;
    // 结课页配置
    EndingPageConfig ending_page_config = 3;
}

// 水印配置
message WatermarkConfig {
    // 是否开启
    bool enable = 1;
    // 水印内容
    string watermark = 2;
}

// 播放限制码
enum PlayLimitCode {
    // 未知
    PLC_UNKNOWN = 0;
    // DRM未登录
    PLC_DRM_NOT_LOGIN = 1;
}

// 按钮样式
message ButtonStyle {
    // 文本
    string text = 1;
    // 文本颜色
    string text_color = 2;
    // 背景颜色
    string bg_color = 3;
    // 跳转链接
    string jump_link = 4;
}

// 播放限制
message PlayLimit {
    // 限制码
    PlayLimitCode code = 1;
    // 提示信息
    string message = 2;
    // 副提示信息
    string sub_message = 3;
    // 按钮样式
    ButtonStyle button = 4;
}
