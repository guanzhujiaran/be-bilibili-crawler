syntax = "proto3";

package bilibili.app.playerunite.ugcanymodel;

// 
message ButtonStyle {
    string text = 1;
    string text_color = 2;
    string bg_color = 3;
    string jump_link = 4;
}

// 播放限制
enum PlayLimitCode {
    // 
    PLC_UNKNOWN = 0;
    // 未付费
    PLC_UGCNOTPAYED = 1;
    // 
    PLC_ChargingPlusNotPass = 2;
    // 
    PLC_ChargingPlusUpgrade = 3;
    // 
    PLC_ChargingPlusReject = 4;
    // 
    PLC_COMMON_CODE = 5;
}

// 
message PlayLimit {
    PlayLimitCode code = 1;
    string message = 2;
    string sub_message = 3;
    ButtonStyle button = 4;
}

// 
message UGCAnyModel {
    PlayLimit play_limit = 1;
    Clip clip = 3;
    ChargingExtend chariging_extend = 4;
}

// 剪辑类型
enum ClipType {
    // 未指定
    CLIP_TYPE_UNSPECIFIED = 0;
    // HE
    CLIP_TYPE_HE = 1;
}

// 剪辑片段信息
message ClipInfo {
    // 剪辑类型
    ClipType clip_type = 1;
    // 素材编号
    int64 material_no = 2;
    // 开始时间
    int64 start = 3;
    // 结束时间
    int64 end = 4;
}

// 剪辑信息
message Clip {
    // 剪辑片段信息
    ClipInfo clip_info = 1;
}

// 充电扩展信息
message ChargingExtend {
    // 广告解锁时长(单次)
    int64 ad_unlock_time_once = 1;
    // 是否IAA
    bool is_iaa = 2;
    // 全屏面板链接
    string full_screen_panel_link = 3;
    // 半屏面板链接
    string half_screen_panel_link = 4;
}

