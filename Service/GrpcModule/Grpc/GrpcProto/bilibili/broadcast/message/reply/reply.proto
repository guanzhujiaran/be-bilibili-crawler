syntax = "proto3";

package bilibili.broadcast.message.reply;

option java_multiple_files = true;

// 主题评论插入-响应
message SubjectReplyInsertionResp {
    // 评论区id
    int64 oid = 1;
    // 评论类型
    int64 type = 2;
    // 评论rpid
    int64 rpid = 3;
    // 排名
    int64 rank = 4;
    // 标题
    string title = 5;
    // 时间戳
    int64 timestamp = 6;
    // 步长
    int64 step_size = 7;
    // 支持标签列表
    repeated string support_tag = 8;
    // 支持标签id列表
    repeated int64 support_tag_ids = 9;
    // 支持模式列表
    repeated int64 support_mode = 10;
}
